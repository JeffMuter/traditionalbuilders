name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  TEMPL_VERSION: v0.3.977
  TAILWIND_VERSION: 3.4.17

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Generate templates
        run: templ generate

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '_templ.go' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install templ + tailwindcss
        run: |
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
          npm install -g tailwindcss@${{ env.TAILWIND_VERSION }}

      - name: Generate templates and CSS
        run: |
          templ generate
          tailwindcss -i static/css/input.css -o static/css/output.css

      - name: Test (race)
        run: go test -race ./... -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install templ + tailwindcss
        run: |
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
          npm install -g tailwindcss@${{ env.TAILWIND_VERSION }}

      - name: Generate templates and CSS
        run: |
          templ generate
          tailwindcss -i static/css/input.css -o static/css/output.css

      # The runner has Chrome preinstalled; point the suite at it so go-rod
      # never needs to download a browser revision.
      - name: Browser E2E
        env:
          E2E_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: go test -tags=e2e -count=1 ./e2e/...

      # Screenshots are written on success (review aid); artifacts/ also holds
      # failure screenshots + DOM + diagnostics when a test fails.
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install templ + tailwindcss
        run: |
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}
          npm install -g tailwindcss@${{ env.TAILWIND_VERSION }}

      - name: Build
        run: make build

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: bin/server
          if-no-files-found: error
